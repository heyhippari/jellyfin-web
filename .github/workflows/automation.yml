name: 'Automation'

on:
  push:
  pull_request_target:

jobs:
  triage:
    name: 'Merge conflict labeling'
    runs-on: ubuntu-latest
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v2.1.0
        if: ${{ github.repository == 'jellyfin/jellyfin-web' }}
        with:
          dirtyLabel: 'merge conflict'
          repoToken: ${{ secrets.JF_BOT_TOKEN }}
